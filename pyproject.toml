[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plaita-nodes"
version = "0.8.0"
description = "plaita 通用节点集：Agent/LLM/决策原子 · 流程控制 · 出害口 · 凭据化连接器（22 节点）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "plaita>=0.5.0",
    "agentproc>=0.15.0",  # on_protocol_line 转发（claude usage/details 依赖）
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml"]
sql = ["sqlalchemy>=2.0", "psycopg2-binary>=2.9", "pymysql>=1.1"]
# decision provider=jevlike 的本地打分器：torch 是唯一可声明硬依赖；
# jevlike 本体（jevlike.data/jevlike.model）经其仓安装（未上 PyPI，懒加载时给出提示）
jevlike = ["torch>=2.0"]
# ags driver（腾讯云 Agent Runtime 沙箱）：e2b 兼容面 SDK，懒加载
ags = ["e2b-code-interpreter>=2"]

[project.entry-points."plaita.nodes"]
agentrun = "plaita_nodes.agent_run:AgentRunNode"
capture = "plaita_nodes.capture:CaptureNode"
hitl = "plaita_nodes.hitl:HitlNode"
llm = "plaita_nodes.llm:LlmNode"
decision = "plaita_nodes.decision:DecisionNode"
gate = "plaita_nodes.gate:GateNode"
rate_limit = "plaita_nodes.rate_limit:RateLimitNode"
report = "plaita_nodes.report:ReportNode"
hitl_await = "plaita_nodes.hitl_await:HitlAwaitNode"
notify = "plaita_nodes.notify:NotifyNode"
writefile = "plaita_nodes.write_file:WriteFileNode"
github_comment = "plaita_nodes.github_comment:GithubCommentNode"
git_publish = "plaita_nodes.git_publish:GitPublishNode"
parse_json = "plaita_nodes.parse_json:ParseJsonNode"
sandbox_agent = "plaita_nodes.sandbox_agent:SandboxAgentNode"
feishu_webhook = "plaita_nodes.webhooks:FeishuWebhookNode"
wecom_webhook = "plaita_nodes.webhooks:WecomWebhookNode"
slack_webhook = "plaita_nodes.webhooks:SlackWebhookNode"
dingtalk_webhook = "plaita_nodes.webhooks:DingtalkWebhookNode"
generic_webhook = "plaita_nodes.api:GenericWebhookNode"
api_request = "plaita_nodes.api:ApiRequestNode"
sql_query = "plaita_nodes.database:SqlQueryNode"
email_send = "plaita_nodes.email:EmailSendNode"

# 沙箱 driver 外部插拔组（设计 docs/sandbox-drivers-design.md §3.3）：
# 本仓 docker driver 由 plaita_nodes.sandbox_docker import 时进程内注册，
# 本组供外部包注册（加载失败降级告警，不炸注册表）。
[project.entry-points."plaita_nodes.sandbox_drivers"]

[tool.hatch.build.targets.wheel]
packages = ["src/plaita_nodes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
