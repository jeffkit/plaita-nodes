name: Publish to PyPI

# 推送 v* 标签时发布 plaita-nodes 到 PyPI。
# 认证：PYPI_API_TOKEN secret（项目级 API token，username=__token__）。
# （如日后改为 Trusted Publishing：删 password 行并在 pypi.org 配
#  Pending Publisher，owner=jeffkit repo=plaita-nodes workflow=本文件名
#  environment=pypi。）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
